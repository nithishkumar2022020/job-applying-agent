[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-job-application-agent"
version = "0.1.0"
description = "Private job discovery, scoring, and approval queue"
requires-python = ">=3.11"

[project.optional-dependencies]
discovery = ["openroles==0.5.1", "python-jobspy==1.4.1"]

[project.scripts]
job-agent = "job_agent.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_agent*"]

